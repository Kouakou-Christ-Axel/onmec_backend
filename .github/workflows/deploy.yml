name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    # Base jetable pour le contrôle de dérive : `migrate diff --from-migrations`
    # rejoue tout l'historique des migrations dans une base fantôme, il lui en
    # faut donc une. Aucune autre étape n'en dépend — les tests unitaires ont
    # toutes leurs dépendances mockées.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Le client Prisma (provider prisma-client) est généré dans
      # src/generated/prisma et compilé par le build : on le régénère
      # systématiquement (pas de cache conditionnel qui le laisserait absent).
      - name: Generate Prisma client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Type check
        run: npx tsc --noEmit

      # Le dépôt embarquait les dépendances ESLint 9 sans fichier de
      # configuration : `pnpm lint` échouait donc systématiquement et rien
      # n'était linté. Variante sans `--fix` : une CI ne doit pas réécrire le
      # code qu'elle vérifie.
      - name: Lint
        run: pnpm lint:check

      # Les tests ne touchaient pas la CI. Les trois régressions introduites
      # pendant le chantier admin/membre n'ont été rattrapées que par des
      # exécutions locales — sans cette étape, elles partaient en production.
      # Toutes les dépendances des specs sont mockées : aucune base requise.
      - name: Unit tests
        run: pnpm test

      # Vérifie que le schéma Prisma et les migrations ne divergent pas. Une
      # dérive ne casse ni le type check ni les tests, mais fait échouer le
      # `migrate deploy` du job suivant, une fois sur le VPS.
      - name: Migration drift check
        run: |
          set -o pipefail
          # `set -e` interromprait le script avant le diagnostic : on capture
          # le code de sortie pour distinguer « la commande a échoué » de
          # « le schéma diverge ». Confondre les deux avait produit un message
          # trompeur au premier passage, annonçant une dérive là où il
          # manquait seulement la base fantôme.
          set +e
          DIFF=$(pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma --script 2>&1)
          CODE=$?
          set -e
          echo "$DIFF"
          if [ $CODE -ne 0 ]; then
            echo "::error::Le contrôle de dérive n'a pas pu s'exécuter (code $CODE)."
            exit 1
          fi
          if ! echo "$DIFF" | grep -q "This is an empty migration"; then
            echo "::error::Le schéma Prisma diverge des migrations."
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow?schema=public

      - name: Build
        run: pnpm build

  migrate:
    name: Migrate & Seed
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    timeout-minutes: 10

    steps:
      - name: Apply migrations and seed on VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh" || { echo "nvm introuvable"; exit 1; }
            APP_DIR="/var/www/onmec/backend"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone git@github.com:${{ github.repository }}.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git pull origin master
            pnpm install --frozen-lockfile
            pnpm exec prisma generate
            pnpm exec prisma migrate deploy
            pnpm exec prisma db seed

  deploy:
    name: Deploy
    needs: migrate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    timeout-minutes: 30

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 25m
          script_stop: true
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh" || { echo "nvm introuvable"; exit 1; }
            nvm use default
            cd /var/www/onmec/backend

            pnpm install --frozen-lockfile

            [ -d dist ] && cp -r dist dist_backup || true

            if ! pnpm exec prisma generate || ! pnpm build; then
              echo "Build failed — restoring previous dist"
              [ -d dist_backup ] && rm -rf dist && mv dist_backup dist || true
              exit 1
            fi

            if ! pm2 reload ecosystem.config.js --env production; then
              echo "Reload failed — restoring previous dist"
              [ -d dist_backup ] && rm -rf dist && mv dist_backup dist && pm2 reload ecosystem.config.js --env production || true
              exit 1
            fi

            rm -rf dist_backup

            sleep 5
            if ! pm2 list | grep -q "onmec-api.*online"; then
              echo "App not online after deploy"
              exit 1
            fi
